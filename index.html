<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/" aria-label="Página inicial">Galeria Social</a>
        <div class="account-menu">
            <button class="account-button" id="account-button" type="button" aria-expanded="false" aria-controls="account-dropdown">
                <span class="account-avatar" id="account-avatar" aria-hidden="true">?</span>
                <span>Minha conta</span>
                <span class="account-chevron" aria-hidden="true">&#9662;</span>
            </button>
            <div class="account-dropdown" id="account-dropdown" hidden>
                <p class="account-email" id="account-email"></p>
                <button class="account-logout" id="account-logout" type="button">Sair da conta</button>
            </div>
        </div>
    </header>
    <main> 
        <div id="feed"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
